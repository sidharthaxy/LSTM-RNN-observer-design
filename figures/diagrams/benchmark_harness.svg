<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" dominant-baseline="hanging" fill="#555555"><tspan x="0" y="660.0">Velocity metrics test the observer; prediction metrics test the model it learned.</tspan></text>
