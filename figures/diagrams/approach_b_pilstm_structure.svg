<rect x="792.9" y="498.0" width="169.3" height="24.0" fill="#ffffff" opacity="0.9"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="877.5" y="510.0">θ_M, θ_V, θ_G, θ_F</tspan></text>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" dominant-baseline="hanging" fill="#555555"><tspan x="0" y="700.0">Purple: static sub-networks (only output layers adapt).  Teal: recurrent friction.  Dashed: weight updates.</tspan></text>
</svg>