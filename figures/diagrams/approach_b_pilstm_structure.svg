<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="1140.0" y="-40.0">M̂</tspan></text>
<polyline points="930.0,120.0 1010.0,190.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
