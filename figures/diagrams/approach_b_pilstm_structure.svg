<rect x="931.4" y="119.2" width="47.2" height="21.5" fill="#ffffff" opacity="0.9"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="955.0" y="130.0">∂M̂/∂q</tspan></text>
<rect x="1010" y="150" width="300" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="1160.0" y="187.5">Assemble</tspan><tspan x="1160.0" y="210.0">τ̂ = Bu − V̂_m q̇ − Ĝ − F̂</tspan><tspan x="1160.0" y="232.5">Φ̂ = M̂⁻¹ τ̂</tspan></text>
<polyline points="930.0,-40.0 1160.0,-40.0 1160.0,150.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
