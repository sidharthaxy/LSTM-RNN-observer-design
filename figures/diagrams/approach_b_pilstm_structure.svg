<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -170 1610 922" width="1610" height="922" role="img">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="-30" y="-170" width="1610" height="922" fill="#ffffff"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="28" dominant-baseline="hanging" fill="#1e1e1e"><tspan x="0" y="-140.0">Approach B: structure of the physics-informed model (PI-LSTM)</tspan></text>
<rect x="0" y="60" width="180" height="60" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="90.0" y="90.0">q̂ = x̂₁</tspan></text>
<rect x="0" y="330" width="180" height="60" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="90.0" y="360.0">q̂̇ = x̂₂</tspan></text>
<rect x="240" y="30" width="280" height="120" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="380.0" y="67.5">Feature layer (fixed)</tspan><tspan x="380.0" y="90.0">ρ(q) = [1, cos kθ, sin kθ]</tspan><tspan x="380.0" y="112.5">cart x cyclic: not used</tspan></text>
<polyline points="180.0,90.0 240.0,90.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="600" y="-70" width="330" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="765.0" y="-37.5">Inertia block (15 params)</tspan><tspan x="765.0" y="-15.0">M̂ = D L Lᵀ D + ε_M I</tspan><tspan x="765.0" y="7.5">softplus diagonal ⇒ SPD</tspan></text>
<rect x="600" y="70" width="330" height="100" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="765.0" y="108.8">Potential block (5)</tspan><tspan x="765.0" y="131.2">P̂ = w_Gᵀρ,   Ĝ = ∇_q P̂</tspan></text>
<rect x="600" y="210" width="330" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="765.0" y="242.5">Coriolis block (20)</tspan><tspan x="765.0" y="265.0">Ĉq̇ = Ṁq̇ − ½∇(q̇ᵀM̂q̇)</tspan><tspan x="765.0" y="287.5">+ skew gyroscopic S</tspan></text>
<rect x="600" y="360" width="330" height="120" rx="12" fill="#c3fae8" stroke="#06b6d4" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="765.0" y="397.5">Friction LSTM (358)</tspan><tspan x="765.0" y="420.0">d = d⁰ softplus(φ_F − 3) &gt; 0</tspan><tspan x="765.0" y="442.5">F̂ = diag(d) q̇</tspan></text>
