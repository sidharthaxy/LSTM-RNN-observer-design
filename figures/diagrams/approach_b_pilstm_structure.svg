<rect x="1370" y="165" width="180" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="1460.0" y="198.8">Φ̂ ≈ q̈</tspan><tspan x="1460.0" y="221.2">to observer</tspan></text>
<polyline points="1310.0,210.0 1370.0,210.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1010" y="320" width="540" height="110" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="1280.0" y="352.5">Holds for every θ̂:  M̂ ⪰ ε_M I;  Ṁ − 2V̂_m skew;</tspan><tspan x="1280.0" y="375.0">Ĝ conservative;  q̇ᵀF̂ ≥ 0</tspan><tspan x="1280.0" y="397.5">⇒ the learned model is passive</tspan></text>
<rect x="0" y="560" width="220" height="90" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="110.0" y="593.8">Measurable error</tspan><tspan x="110.0" y="616.2">e = x̃₁ + ν</tspan></text>
<rect x="280" y="550" width="420" height="110" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="490.0" y="582.5">Adjoint Jacobian engine, O(p)</tspan><tspan x="490.0" y="605.0">kinetic metric W = M̂ ⇒ λ = e</tspan><tspan x="490.0" y="627.5">Φ′_βᵀ M̂ e for each block</tspan></text>
<polyline points="220.0,605.0 280.0,605.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="760" y="550" width="440" height="110" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/>
<text font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e"><tspan x="980.0" y="582.5">Blockwise adaptation</tspan><tspan x="980.0" y="605.0">θ̂̇_β = proj_β(Γ_β Φ′_βᵀ M̂ e)</tspan><tspan x="980.0" y="627.5">β ∈ {M, V, G, F}</tspan></text>
<polyline points="700.0,605.0 760.0,605.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/>
